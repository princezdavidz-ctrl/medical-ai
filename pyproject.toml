[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-hospital-backend"
version = "0.1.0"
description = "Secure multi-hospital backend for the Medical AI Hospital System"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0", "pydantic-settings>=2.5,<3.0", "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0", "python-multipart>=0.0.9", "email-validator>=2.2,<3.0", "redis>=5.0,<6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI intentionally uses Depends/Form/Header in parameter defaults; import ordering
# and UTC alias rewrites are stylistic and are not enforced by this baseline CI.
ignore = ["B008", "I001", "UP017"]
