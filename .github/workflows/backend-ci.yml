name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "phase-1/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: ruff check app tests migrations
      - name: Test
        env:
          SECRET_KEY: test-secret-key-for-unit-tests-only-123456
          ENVIRONMENT: test
        run: pytest -q
