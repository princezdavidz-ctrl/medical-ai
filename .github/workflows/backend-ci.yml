name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "phase-1/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medical_ai
          POSTGRES_USER: medical
          POSTGRES_PASSWORD: medical_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical -d medical_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-secret-key-for-unit-tests-only-123456
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://medical:medical_test_password@localhost:5432/medical_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: ruff check app tests migrations
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Test
        run: pytest -q
